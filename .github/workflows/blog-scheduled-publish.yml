name: Blog scheduled publish

on:
  schedule:
    # 18:00 JST. GitHub Actions cron can start a few minutes late.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Select and validate the due PR without merging"
        required: false
        type: boolean
        default: true

permissions:
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: blog-daily-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6

      - name: Select, validate, and merge one due article
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MANUAL_APPROVER: LEXIA-Saito
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require("node:path")
            const { pathToFileURL } = require("node:url")
            const helperUrl = pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, "scripts/blog/publication-metadata.mjs")
            ).href
            const { selectDuePullRequest } = await import(helperUrl)

            const owner = context.repo.owner
            const repo = context.repo.repo
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            })
            const selected = selectDuePullRequest(pullRequests, new Date())

            if (!selected) {
              core.info("公開時刻を迎えた blog:ready PR はありません。")
              return
            }

            const pr = selected.pullRequest
            const labels = new Set(pr.labels.map((label) => label.name))
            core.info(`公開候補: #${pr.number} ${pr.title} (${selected.metadata.publishAt})`)

            if (!pr.head.ref.startsWith("blog/")) {
              core.setFailed(`記事ブランチではありません: ${pr.head.ref}`)
              return
            }

            const combined = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: pr.head.sha,
            })
            const vercel = combined.data.statuses.find((status) => status.context === "Vercel")
            if (!vercel || vercel.state !== "success") {
              core.setFailed("Vercel Previewが成功していません。")
              return
            }

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            })
            const articleCheck = checkRuns.find((check) => check.name === "validate")
            if (!articleCheck || articleCheck.conclusion !== "success") {
              core.setFailed("Blog article policyチェックが成功していません。")
              return
            }
            const failedChecks = checkRuns.filter((check) =>
              check.status === "completed" &&
              !["success", "neutral", "skipped"].includes(check.conclusion)
            )
            if (failedChecks.length > 0) {
              core.setFailed(`失敗中のチェックがあります: ${failedChecks.map((check) => check.name).join(", ")}`)
              return
            }

            // Human review gate (ALL articles): the owner must add `blog:manual-approved`.
            //
            // This used to require an APPROVED review from MANUAL_APPROVER, but the daily
            // automation opens the PR as that same account and GitHub refuses self-approval
            // ("Can not approve your own pull request"), so the gate could never be satisfied.
            // A label carries the same "a human looked at the Vercel Preview" signal and can be
            // applied by the PR author.
            //
            // The label must have been applied AFTER the current head commit, which preserves the
            // old rule that a new commit invalidates the approval.
            if (!labels.has("blog:manual-approved")) {
              core.setFailed(
                `${process.env.MANUAL_APPROVER} による blog:manual-approved ラベルが必要です（Vercel Previewを確認のうえ付与してください）。`,
              )
              return
            }

            const timeline = await github.paginate(github.rest.issues.listEvents, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            })
            const approvals = timeline.filter(
              (event) =>
                event.event === "labeled" &&
                event.label?.name === "blog:manual-approved" &&
                event.actor?.login === process.env.MANUAL_APPROVER,
            )
            const latestApproval = approvals[approvals.length - 1]
            if (!latestApproval) {
              core.setFailed(
                `blog:manual-approved は ${process.env.MANUAL_APPROVER} 本人が付与する必要があります。`,
              )
              return
            }

            const headCommit = await github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha })
            const headCommittedAt = Date.parse(
              headCommit.data.commit.committer?.date || headCommit.data.commit.author?.date,
            )
            const approvedAt = Date.parse(latestApproval.created_at)
            if (approvedAt < headCommittedAt) {
              core.setFailed(
                `承認ラベルは最新コミット(${pr.head.sha.slice(0, 7)})より前に付与されています。Previewを再確認のうえラベルを付け直してください。`,
              )
              return
            }

            // Affiliate articles need a second, dedicated sign-off on top of the review label.
            if (labels.has("blog:affiliate") && !labels.has("blog:affiliate-approved")) {
              core.setFailed("アフィリエイト記事に blog:affiliate-approved がありません。")
              return
            }

            if (process.env.DRY_RUN === "true") {
              core.info("dry-runのためマージしません。")
              return
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: "squash",
              commit_title: pr.title,
              commit_message: `Scheduled blog publication: ${selected.metadata.publishAt}`,
            })
            if (!merge.data.merged) {
              core.setFailed(`PRをマージできませんでした: ${merge.data.message}`)
              return
            }

            core.info(`PR #${pr.number} を ${merge.data.sha} としてマージしました。`)

            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const production = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: merge.data.sha,
              })
              const deployment = production.data.statuses.find((status) => status.context === "Vercel")
              if (deployment?.state === "success") {
                core.info(`Vercel本番デプロイ成功: ${deployment.target_url}`)
                return
              }
              if (deployment?.state === "failure" || deployment?.state === "error") {
                core.setFailed(`Vercel本番デプロイ失敗: ${deployment.target_url || "URLなし"}`)
                return
              }
              core.info(`Vercel本番デプロイ待機中 (${attempt}/20)`)
              await new Promise((resolve) => setTimeout(resolve, 30000))
            }

            core.setFailed("10分以内にVercel本番デプロイの成功を確認できませんでした。")
