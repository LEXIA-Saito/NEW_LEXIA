name: Blog article ready

# Grants (or revokes) the blog:ready label automatically once every gate is green:
# article policy "validate" check + Vercel Preview + no failing checks, and the PR
# is a non-affiliate blog/ article with publish metadata. Affiliate PRs are never
# auto-readied (they go through the manual approval gate instead).

on:
  status: {}
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "lib/blog-posts-fallback.ts"

permissions:
  checks: read
  contents: read
  pull-requests: write
  statuses: read

concurrency:
  group: blog-article-ready-${{ github.event.pull_request.number || github.event.sha || github.event.check_suite.head_sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6

      - name: Evaluate and sync blog:ready
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require("node:path")
            const { pathToFileURL } = require("node:url")
            const helperUrl = pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, "scripts/blog/publication-metadata.mjs")
            ).href
            const { evaluateArticleReadiness } = await import(helperUrl)

            const owner = context.repo.owner
            const repo = context.repo.repo
            const READY = "blog:ready"

            // Resolve which PRs this event touches.
            async function candidatePrNumbers() {
              if (context.eventName === "pull_request") {
                return [context.payload.pull_request.number]
              }
              const sha =
                context.payload.sha ||
                context.payload.check_suite?.head_sha ||
                context.payload.commit?.sha
              if (!sha) return []
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: sha, per_page: 100 },
              )
              const open = associated.filter((pr) => pr.state === "open")
              if (open.length > 0) return open.map((pr) => pr.number)
              // Fallback: match open PRs whose head sha equals the event sha.
              const all = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              })
              return all.filter((pr) => pr.head.sha === sha).map((pr) => pr.number)
            }

            const numbers = [...new Set(await candidatePrNumbers())]
            if (numbers.length === 0) {
              core.info("対象のPRがありません。")
              return
            }

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number })
              const labelNames = new Set(pr.labels.map((label) => label.name))
              if (!labelNames.has("blog:article")) {
                core.info(`#${number}: blog:article ではないためスキップ`)
                continue
              }

              const combined = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pr.head.sha,
              })
              const vercel = combined.data.statuses.find((status) => status.context === "Vercel")

              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              })
              const validate = checkRuns.find((check) => check.name === "validate")
              const failedCheckNames = checkRuns
                .filter(
                  (check) =>
                    check.name !== "evaluate" &&
                    check.status === "completed" &&
                    !["success", "neutral", "skipped"].includes(check.conclusion),
                )
                .map((check) => check.name)

              const { ready, reasons } = evaluateArticleReadiness({
                pr,
                labels: pr.labels,
                vercelState: vercel?.state,
                validateConclusion: validate?.conclusion,
                failedCheckNames,
              })

              if (ready && !labelNames.has(READY)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: number,
                  labels: [READY],
                })
                core.info(`#${number}: 全ゲート通過のため ${READY} を付与しました。`)
              } else if (!ready && labelNames.has(READY)) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: READY })
                } catch (error) {
                  if (error.status !== 404) throw error
                }
                core.info(`#${number}: 条件未達のため ${READY} を解除しました（${reasons.join(" / ")}）。`)
              } else {
                core.info(`#${number}: ${ready ? "既にready" : reasons.join(" / ")}`)
              }
            }
